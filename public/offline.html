<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf1e2" />
    <title>Our Table is offline</title>
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "Nunito", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: #2f2a24;
        background: #f4ead7;
      }
      main {
        width: min(100%, 34rem);
        padding: clamp(2rem, 8vw, 4rem);
        text-align: center;
        background: #fffaf0;
        border: 1px solid #d4bea0;
        border-radius: 8px 18px 12px 8px;
        box-shadow: 4px 6px 0 #ead8b8;
      }
      img { width: 5rem; height: 5rem; }
      p:first-of-type {
        margin: 1.5rem 0 0;
        color: #b8401f;
        font-size: .7rem;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      h1 { margin: .5rem 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
      p:last-of-type { color: #716657; line-height: 1.6; }
      button {
        margin-top: 1rem;
        padding: .8rem 1.25rem;
        border: 0;
        border-radius: 999px;
        color: #fffaf0;
        background: #e0552f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <p>The table is still here</p>
      <h1>You’re offline</h1>
      <p>Reconnect to open your household’s latest recipes, plans, shopping list, and memories.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
